[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "retail-decision-intelligence"
version = "0.1.0"
description = "Historical-sales-based inventory decision experiments with explicit operating assumptions"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "streamlit>=1.38,<2", "pyarrow>=15,<25", "matplotlib>=3.8,<4", "threadpoolctl>=3,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
retailos = "retailos.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
